<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>貂貂端午节长春旅游计划</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="page-header">
    <h1>貂貂端午节长春旅游计划</h1>
    <button id="theme-toggle" class="theme-toggle" title="切换主题">
      <svg id="theme-icon" class="theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
      <svg id="theme-icon-sun" class="theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
    </button>
  </header>
  <div class="trip-map-container">
    <div class="trip-map-left">
      <div id="checklist-container" class="checklist-container"></div>
    </div>
    <div class="trip-map-right">
      <div id="map-container"></div>
      <div id="route-panel" class="route-panel" style="display:none;"></div>
    </div>
  </div>

  <script src="https://webapi.amap.com/loader.js"></script>
  <script src="./data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
